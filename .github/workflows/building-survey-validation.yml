name: Building survey validation

on:
  push:
    branches:
      - fix/building-survey-maps-20261110
      - urban-analysis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install same Python dependencies as Dockerfile
        run: python -m pip install --disable-pip-version-check fastapi "uvicorn[standard]" requests boto3 Pillow pydantic pyproj pyshp shapely ezdxf rasterio "psycopg[binary]"
      - name: Python syntax across all tracked modules
        run: python -m compileall -q .
      - name: JavaScript syntax
        run: node --check development-ui.js
      - name: Development UI state and zoning merge regressions
        run: node test_development_ui.cjs
      - name: Building survey deterministic regression tests
        run: python -m unittest -v test_development_building_theme
      - name: Official DEM elevation area, map and ledger-isolation tests
        run: python -m unittest -v test_development_elevation
      - name: Seoul existing 20m elevation reference regressions
        run: python -m unittest -v test_development_seoul_elevation
      - name: Contour TIN and 10m grid reference slope tests
        run: python -m unittest -v test_development_contour_tin
      - name: Install CAD test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx
      - name: Nationwide viewport zoning API and report isolation regression tests
        run: python -m unittest -v test_development_review.Tests.test_planning_view_zoning_full_viewport_without_mutating_site_fact test_development_review.Tests.test_planning_view_allowlist_and_bounds test_development_review.Tests.test_viewport_skips_broken_geometry_but_keeps_third_residential
      - name: CAD DXF, building-area and A3 regression tests
        run: python -m pytest -q test_development_cad.py test_development_building_areas.py
      - name: Viewport zoning scope and FACT isolation regression tests
        run: python -m unittest -v test_development_planning_view
      - name: National planning symbols ACI/geometry regression tests
        run: python -m unittest -v test_development_planning_symbols
      - name: Private R2 land-cover adapter isolated regression tests
        run: python -m unittest -v test_development_landcover_r2
      - name: WMS boundary masking and print sheet regression tests
        run: python -m unittest -v test_development_landcover_preview
      - name: Application import smoke test
        run: python -c "import app; print('FastAPI import OK')"
