name: One-time cleanup of obsolete development branches
on:
  push:
    branches:
      - feature/landcover-indexed-20261111
    paths:
      - .github/workflows/cleanup-legacy-branches-once.yml
permissions:
  contents: write
  pull-requests: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: archive and delete obsolete branches (one-time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original branch tips, archive and clean up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, subprocess, sys
          from urllib.parse import quote
          
          repo = os.environ["GITHUB_REPOSITORY"]
          active = "feature/landcover-indexed-20261111"
          keep = {"main", active}
          old = [{"name":"feature/building-status-tables-20261110","sha":"dc58dfb4fe3d007055a19fd9de271d594522a4a6"},{"name":"feature/fact-boundary-20261110","sha":"471478eaa02033ad56d12ae849b91188f91b48e9"},{"name":"feature/nature-drawings-report-20261110","sha":"9e5ee9de35453a15c02265054012dbc679df9bba"},{"name":"feature/nature-survey-tables-20261110","sha":"bcd17a72d5322e300d9b4be67f522970aeff9138"},{"name":"feature/nature-vector-maps-43-46-20261110","sha":"88f2bafc378b475be5c08cc426fb61ac13d6bc9a"},{"name":"feature/planning-map-styles-opacity-20261110","sha":"16a981fbee75cbe3a5aa7f6d3a643061129b10d3"},{"name":"feature/survey-auto-paper-scale-20261110","sha":"a11a531d02b1bd4eef89ec59e551589b6864fcb2"},{"name":"feature/survey-native-sources-20261110","sha":"2239fd77e49175d14023f335c6dead8242a767ba"},{"name":"feature/survey-standalone-20261110","sha":"c8df25db268fb54fca59b6bd6ab569f6d567829e"},{"name":"fix/building-survey-maps-20261110","sha":"796d99b24dce7718a7a3d09ab64ff4e2c3d71ec1"},{"name":"fix/cad-complete-sheet-chain2-20261110","sha":"7cc0c4c4a03346dd8cd2002ac501ab01e52e3968"},{"name":"fix/dxf-initial-view-20261110","sha":"b26219b3a28263cd42c739240b4e080a110e96ed"},{"name":"fix/survey-building-live-gis-20261110","sha":"a2e0b8df1b8c4fe6e35893df06c41b105c3e829b"},{"name":"fix/survey-thematic-diagnostics-20261110","sha":"6536e9473270a4f6c88ec1d2dc93f74ea9789524"},{"name":"refactor/repository-structure-20261110","sha":"a920f5fa5cb4ae6f0fa31262326a6b361aed5a67"},{"name":"taejinnimida-patch-1","sha":"99c20a9a0b6f6cb975ee2c165a575b9316dd2a12"},{"name":"taejinnimida-patch-2","sha":"4ec35a07397042a47e7a56d5feb1fbad7af3c61d"}]
          tag = "archive/pre-cleanup-20261111"
          env = dict(os.environ, GIT_AUTHOR_NAME="github-actions[bot]", GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com", GIT_COMMITTER_NAME="github-actions[bot]", GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com")
          
          def cmd(*args, input=None):
              p = subprocess.run(args, input=input, text=True, capture_output=True, env=env)
              if p.returncode:
                  raise RuntimeError(f"Command failed {args[0:3]}: {p.stderr[:1000]}")
              return p.stdout.strip()
          
          def api(method, path, *fields):
              result = cmd("gh", "api", "-X", method, path, *fields)
              return json.loads(result) if result else None
          
          if os.environ.get("GITHUB_REF") != "refs/heads/" + active:
              raise RuntimeError("Wrong source branch, refusing cleanup")
          current = api("GET", f"repos/{repo}/branches?per_page=100")
          present = {b["name"]: b["commit"]["sha"] for b in current}
          if not keep.issubset(present):
              raise RuntimeError("Protected branches absent")
          if set(present) != keep | {b["name"] for b in old}:
              raise RuntimeError("Unexpected branch inventory; stop without deleting anything")
          for b in old:
              if present.get(b["name"]) != b["sha"]:
                  raise RuntimeError("Branch moved since preflight; stop without deleting anything: " + b["name"])
          # Preserve all 17 unique histories with ONE immutable tag. This tag is not
          # reachable from main or the active branch and will not affect their merges.
          tree = cmd("git", "rev-parse", "refs/remotes/origin/main^{tree}")
          parents = []
          for b in old:
              cmd("git", "cat-file", "-e", b["sha"] + "^{commit}")
              parents.extend(("-p", b["sha"]))
          message = "Archive branch tips before cleanup; not merged into active code.\\n\\n" + "\\n".join(b["name"] + " " + b["sha"] for b in old)
          archive_commit = cmd("git", "commit-tree", tree, *parents, input=message + "\\n")
          cmd("git", "tag", "-a", tag, archive_commit, "-m", "Historical development branches before cleanup")
          cmd("git", "push", "origin", f"refs/tags/{tag}")
          print("Created archive tag", tag, archive_commit)
          # Close only obsolete branch-head PRs. Current active and main are never touched.
          prs = api("GET", f"repos/{repo}/pulls?state=open&per_page=100")
          deleted = {b["name"] for b in old}
          for pr in prs:
              head = pr["head"]["ref"]
              if head in deleted and pr["head"]["repo"]["full_name"] == repo:
                  api("PATCH", f"repos/{repo}/pulls/{pr['number']}", "-f", "state=closed")
                  print("Closed obsolete PR", pr["number"])
          for b in old:
              # Never delete a branch whose tip changed after preflight.
              current_ref = api("GET", f"repos/{repo}/git/ref/heads/{b['name']}")
              if current_ref["object"]["sha"] != b["sha"]:
                  raise RuntimeError("Branch changed mid-cleanup, refusing deletion: " + b["name"])
              api("DELETE", f"repos/{repo}/git/refs/heads/{b['name']}")
              print("Deleted obsolete branch", b["name"])
          remaining = api("GET", f"repos/{repo}/branches?per_page=100")
          names = sorted(x["name"] for x in remaining)
          if names != sorted(keep):
              raise RuntimeError("Unexpected remaining branches: " + str(names))
          print("SUCCESS: remaining branches", names)
