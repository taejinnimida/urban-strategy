name: Standalone building GIS WFS source
on:
  push:
    branches:
      - fix/survey-building-live-gis-20261110
  pull_request:
    paths:
      - 'facts/vworld.py'
      - 'development/building/live.py'
      - 'development/building/spatial.py'
      - 'development/sources.py'
      - 'tests/test_building_gis_live.py'
      - '.github/workflows/building-gis-live.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements for offline source tests
        run: python -m pip install fastapi pydantic requests shapely pyproj pyshp ezdxf httpx
      - name: Syntax
        run: python -m py_compile development/building/live.py development/building/spatial.py development/sources.py facts/vworld.py
      - name: Test WFS source geometry, classification and DXF
        run: python -m unittest tests.test_building_gis_live tests.test_building_spatial -v
      - name: Regression data-only source integration
        run: python -m unittest tests.test_development_review tests.test_fact_boundary -v
