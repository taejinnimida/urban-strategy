services:
  - type: web
    name: urban-strategy
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BUILDING_HUB_API_KEY
        sync: false
      - key: VWORLD_API_KEY
        sync: false
      - key: VWORLD_DOMAIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
