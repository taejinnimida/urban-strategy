name: Nature vector survey validation

on:
  push:
    branches:
      - feature/nature-vector-maps-43-46-20261110
      - refactor/repository-structure-20261110
  pull_request:
    paths:
      - 'development/**/*.py'
      - 'app.py'
      - 'dev_app.py'
      - 'tests/**/*.py'
      - 'tests/*.py'
      - 'development/nature/vector.py'
      - 'development/nature/tables.py'
      - 'development/cad.py'
      - 'development/sources.py'
      - 'development/survey_sheet.py'
      - 'development-ui.js'
      - 'tests/test_development_nature_vector.py'
      - '.github/workflows/nature-vector-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-nature:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline dependencies
        run: python -m pip install shapely pyproj fastapi pydantic requests ezdxf pyshp pytest httpx
      - name: Verify Python syntax
        run: |
          python -m compileall -q development tests
      - name: Verify JS syntax
        run: node --check development-ui.js
      - name: Run relocated JS regression test
        run: node tests/test_development_ui.cjs
      - name: Nature vector fixtures (no network or API credentials)
        run: python -m unittest tests.test_development_nature_vector -v
      - name: DEM class fixtures
        run: python -m unittest tests.test_development_terrain_classes -v
      - name: Run nationwide and Seoul route isolation smoke tests
        run: python -m unittest tests.test_development tests.test_development_review -v
      - name: Module-boundary and moved-asset tests
        run: python -m unittest tests.test_repo_structure -v
