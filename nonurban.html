<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비시가화지역 개발 검토 · DEV</title><link rel="stylesheet" href="/dev-assets/style.css"><header><a href="/">← 검토모드 선택</a><h1>비시가화지역 개발 검토</h1><span class="tag">전국 대상 / 개발용 초안</span></header><main><div class="notice">공공자료 자동조회·법정기준 판정은 연결 전입니다. 입력값과 도형만으로 개발 가능 여부를 판단하지 않습니다.</div><form id="intake"><section><h2>01 대상지 및 사업조건</h2><div class="grid"><label>관할 시·군·구<input name="jurisdiction" maxlength="100" placeholder="예: 충청북도 음성군"></label><label>대상지 주소<input name="address" maxlength="300" placeholder="법정동·리와 지번"></label><label>검토 사업유형<select name="project"><option value="development">도시개발사업</option><option value="district">지구단위계획</option><option value="industrial">산업단지 개발</option><option value="facility">도시·군계획시설사업</option><option value="building">개별 개발행위·건축</option></select></label><label>용도지역 (확인한 값만 입력)<input name="zoning" maxlength="100" placeholder="미확인 시 비워두세요"></label><label>구역면적 (㎡)<input name="area_m2" type="number" min="0.01" max="10000000000" step="any" placeholder="구역계가 있으면 계산면적 우선"></label></div><label>계획내용 및 확인사항<textarea name="notes" rows="3" maxlength="5000"></textarea></label></section><section><h2>02 구역계 현황</h2><label>GeoJSON 구역계 불러오기<input id="boundary" type="file" accept=".geojson,.json"></label><p class="muted">WGS84 경도·위도 / Polygon·MultiPolygon 1개. 투영좌표는 QGIS에서 EPSG:4326으로 변환 후 입력하세요. 아래는 배경지도 없는 구역계 미리보기입니다.</p><svg id="drawing" viewBox="0 0 600 250" aria-label="구역계 미리보기"></svg><p id="boundaryInfo">구역계 미입력</p><button type="button" id="clearBoundary" class="secondary">구역계 지우기</button></section><div class="actions"><button type="submit">입력자료 검토</button><button type="button" id="save" class="secondary">초안 파일 저장</button><button type="button" id="restore" class="secondary">초안 불러오기</button><button type="button" id="print" class="secondary">현재 화면 인쇄 / PDF</button></div><input hidden id="draft" type="file" accept=".json"><p id="message" role="status"></p></form><section id="results" hidden><h2>03 검토자료 현황</h2><p id="summary"></p><table><thead><tr><th>검토항목</th><th>상태</th><th>필요한 자료</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/dev-assets/nonurban.js"></script></html>
